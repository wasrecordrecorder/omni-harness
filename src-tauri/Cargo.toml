[package]
name = "omni-harness"
version = "1.0.3"
description = "OmniHarness Windows 11 AI-Agent Harness"
edition = "2021"

[lib]
name = "omni_harness_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-notification = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1.42", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = "4.2"
uuid = { version = "1.11", features = ["v4", "serde"] }
rand = "0.8"
thiserror = "2.0"
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking", "socks"] }
futures-util = "0.3"
portable-pty = "0.8"
sysinfo = "0.32"
ignore = "0.4"
regex = "1.11"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
base64 = "0.22"
tungstenite = "0.24"
url = "2.5"
urlencoding = "2.1"
wait-timeout = "0.2"
serde_yaml = "0.9"
tiktoken-rs = "0.12.1"
blake3 = "1.5"
png = "0.17"
flate2 = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory"
] }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
opt-level = 3
